server {
    listen $PORT;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass https://noble-possibility-production-55ee.up.railway.app/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}